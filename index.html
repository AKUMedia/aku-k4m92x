<style>
  body { background:#08080A; color:#EDEDF0; font-family:Inter,sans-serif; -webkit-font-smoothing:antialiased; }

  .bar { height:3px; background:rgba(255,255,255,0.07); border-radius:99px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:#DB2022; border-radius:99px; transition:width .35s ease; }
  .bar.done > i { background:#3ED9A4; }
  .tick { width:20px; height:20px; flex:0 0 20px; border-radius:6px; border:1.5px solid rgba(255,255,255,0.22); display:grid; place-items:center; cursor:pointer; transition:all .15s; margin-top:1px; }
  .tick:hover { border-color:#DB2022; }
  .tick.on { background:#3ED9A4; border-color:#3ED9A4; }

  .task.on span.t { color:#6E6E78; text-decoration:line-through; text-decoration-color:rgba(255,255,255,.2); }

  details > summary::-webkit-details-marker { display:none; }
  details[open] .chev { transform:rotate(180deg); }

  :focus-visible { outline:2px solid #DB2022; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

const KEY = 'aku-goals-v1';
let state = {};
let memoryOnly = false;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    state = raw ? JSON.parse(raw) : {};
  } catch (e) { memoryOnly = true; state = {}; }
}
function save() {
  if (memoryOnly) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { memoryOnly = true; }
}

const key = (d, s, t) => `${d}.${s}.${t}`;
const isDone = (d, s, t) => !!state[key(d, s, t)];

function stagePct(dir, si) {
  const st = dir.stages[si];
  const done = st.tasks.filter((_, ti) => isDone(dir.id, si, ti)).length;
  return st.tasks.length ? done / st.tasks.length : 0;
}
function dirPct(dir) {
  const total = dir.stages.reduce((a, s) => a + s.w, 0);
  const got = dir.stages.reduce((a, s, i) => a + s.w * stagePct(dir, i), 0);
  return total ? got / total : 0;
}
function nextTask(dir) {
  for (let si = 0; si < dir.stages.length; si++) {
    for (let ti = 0; ti < dir.stages[si].tasks.length; ti++) {
      if (!isDone(dir.id, si, ti)) return dir.stages[si].tasks[ti];
    }
  }
  return null;
}

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

function render() {
  const app = document.getElementById('app');
  app.innerHTML = DATA.map(dir => {
    const p = Math.round(dirPct(dir) * 100);
    const nx = nextTask(dir);
    const stages = dir.stages.map((st, si) => {
      const sp = Math.round(stagePct(dir, si) * 100);
      const tasks = st.tasks.map((t, ti) => {
        const on = isDone(dir.id, si, ti);
        return `<li class="task ${on ? 'on' : ''} flex gap-3 items-start py-[7px]">
          <button class="tick ${on ? 'on' : ''}" data-d="${dir.id}" data-s="${si}" data-t="${ti}" aria-pressed="${on}" aria-label="Отметить">${CHECK}</button>
          <span class="t text-[14px] leading-[1.5]">${t}</span>
        </li>`;
      }).join('');
      return `<div class="pt-5 first:pt-1">
        <div class="flex items-baseline justify-between gap-3 mb-2">
          <h3 class="font-display text-[15px] font-semibold">${st.name}</h3>
          <span class="text-[12px] text-muted shrink-0 tabular-nums">${sp}% · вес ${st.w}</span>
        </div>
        <div class="bar ${sp === 100 ? 'done' : ''} mb-1"><i style="width:${sp}%"></i></div>
        <ul>${tasks}</ul>
      </div>`;
    }).join('');

    return `<details class="glass rounded-2xl overflow-hidden">
      <summary class="p-5">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <div class="flex items-center gap-2.5 mb-1.5">
              <h2 class="font-display text-[19px] font-semibold">${dir.name}</h2>
              <span class="text-[11px] text-muted border border-line rounded px-1.5 py-0.5 shrink-0">вес ${dir.weight}</span>
            </div>
            <p class="text-[13px] text-muted leading-relaxed">${dir.goal}</p>
          </div>
          <div class="text-right shrink-0">
            <div class="font-display text-[24px] font-bold tabular-nums ${p === 100 ? 'text-akugreen' : ''}">${p}%</div>
            <svg class="chev w-4 h-4 text-muted ml-auto mt-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>
        <div class="bar ${p === 100 ? 'done' : ''} mt-4"><i style="width:${p}%"></i></div>
        ${nx ? `<p class="mt-3 text-[13px] leading-relaxed"><span class="text-akured">Следующий шаг:</span> <span class="text-white/80">${nx}</span></p>`
             : `<p class="mt-3 text-[13px] text-akugreen">Направление закрыто полностью</p>`}
        ${dir.note ? `<p class="mt-2 text-[12px] text-muted leading-relaxed">${dir.note}</p>` : ''}
      </summary>
      <div class="px-5 pb-5 border-t border-line">${stages}</div>
    </details>`;
  }).join('');

  const totalW = DATA.reduce((a, d) => a + d.weight, 0);
  const got = DATA.reduce((a, d) => a + d.weight * dirPct(d), 0);
  const pct = Math.round((got / totalW) * 100);
  document.getElementById('totalPct').textContent = pct + '%';
  document.getElementById('totalBar').style.width = pct + '%';

  let all = 0, done = 0;
  DATA.forEach(d => d.stages.forEach((s, si) => {
    all += s.tasks.length;
    s.tasks.forEach((_, ti) => { if (isDone(d.id, si, ti)) done++; });
  }));
  document.getElementById('totalStats').textContent =
    `${done} из ${all} задач · ${DATA.length} направления` + (memoryOnly ? ' · прогресс не сохраняется в этом окне' : '');
}

document.addEventListener('click', e => {
  const b = e.target.closest('.tick');
  if (!b) return;
  const k = key(b.dataset.d, b.dataset.s, b.dataset.t);
  const parent = b.closest('details');
  const scroll = window.scrollY;
  state[k] = !state[k];
  if (!state[k]) delete state[k];
  save();
  const openIds = [...document.querySelectorAll('details')].map(d => d.open);
  render();
  [...document.querySelectorAll('details')].forEach((d, i) => d.open = openIds[i]);
  window.scrollTo(0, scroll);
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Снять все галочки и начать заново?')) return;
  state = {};
  save();
  render();
});

(function days() {
  const end = new Date('2026-12-31T23:59:59');
  const n = Math.max(0, Math.ceil((end - new Date()) / 86400000));
  document.getElementById('daysLeft').textContent = n + ' дней до конца года';
})();

load();
render();
</script>
