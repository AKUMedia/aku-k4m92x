function load() {
  try {
    state = JSON.parse(localStorage.getItem(KEY) || '{}');
    money = JSON.parse(localStorage.getItem(MKEY) || 'null') || structuredClone(DEFAULT_MONEY);
  } catch (e) { memoryOnly = true; state = {}; money = structuredClone(DEFAULT_MONEY); }
}
function save() {
  if (memoryOnly) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(MKEY, JSON.stringify(money)); }
  catch (e) { memoryOnly = true; }
}
const money$ = n => '$' + Math.round(Number(n) || 0).toLocaleString('ru-RU').replace(/\u00A0/g, ' ');
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ ЗАДАЧИ ============ */
const key = (d,s,t) => d + '.' + s + '.' + t;
const isDone = (d,s,t) => !!state[key(d,s,t)];
function stagePct(dir, si) {
  const st = dir.stages[si];
  const done = st.tasks.filter((_, ti) => isDone(dir.id, si, ti)).length;
  return st.tasks.length ? done / st.tasks.length : 0;
}
function dirPct(dir) {
  const tot = dir.stages.reduce((a,s) => a + s.w, 0);
  const got = dir.stages.reduce((a,s,i) => a + s.w * stagePct(dir, i), 0);
  return tot ? got / tot : 0;
}
function nextTask(dir) {
  for (let si = 0; si < dir.stages.length; si++)
    for (let ti = 0; ti < dir.stages[si].tasks.length; ti++)
      if (!isDone(dir.id, si, ti)) return dir.stages[si].tasks[ti];
  return null;
}
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

function renderPlan() {
  document.getElementById('app').innerHTML = DATA.map(dir => {
    const p = Math.round(dirPct(dir) * 100), nx = nextTask(dir);
    const stages = dir.stages.map((st, si) => {
      const sp = Math.round(stagePct(dir, si) * 100);
      const tasks = st.tasks.map((t, ti) => {
        const on = isDone(dir.id, si, ti);
        return '<li class="task ' + (on ? 'on' : '') + ' flex gap-3 items-start py-[7px]">' +
          '<button class="tick ' + (on ? 'on' : '') + '" data-d="' + dir.id + '" data-s="' + si + '" data-t="' + ti + '" aria-pressed="' + on + '" aria-label="Отметить">' + CHECK + '</button>' +
          '<span class="t text-[14px] leading-[1.5]">' + esc(t) + '</span></li>';
      }).join('');
      return '<div class="pt-5 first:pt-1">' +
        '<div class="flex items-baseline justify-between gap-3 mb-2">' +
        '<h3 class="font-display text-[15px] font-semibold">' + esc(st.name) + '</h3>' +
        '<span class="text-[12px] text-muted shrink-0 tabular-nums">' + sp + '% · вес ' + st.w + '</span></div>' +
        '<div class="bar ' + (sp === 100 ? 'done' : '') + ' mb-1"><i style="width:' + sp + '%"></i></div>' +
        '<ul>' + tasks + '</ul></div>';
    }).join('');

    return '<details class="glass rounded-2xl overflow-hidden"><summary class="p-5">' +
      '<div class="flex items-start justify-between gap-4"><div class="min-w-0">' +
      '<div class="flex items-center gap-2.5 mb-1.5"><h2 class="font-display text-[19px] font-semibold">' + esc(dir.name) + '</h2>' +
      '<span class="text-[11px] text-muted border border-white/10 rounded px-1.5 py-0.5 shrink-0">вес ' + dir.weight + '</span></div>' +
      '<p class="text-[13px] text-muted leading-relaxed">' + esc(dir.goal) + '</p></div>' +
      '<div class="text-right shrink-0"><div class="font-display text-[24px] font-bold tabular-nums ' + (p === 100 ? 'text-akugreen' : '') + '">' + p + '%</div>' +
      '<svg class="chev w-4 h-4 text-muted ml-auto mt-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div></div>' +
      '<div class="bar ' + (p === 100 ? 'done' : '') + ' mt-4"><i style="width:' + p + '%"></i></div>' +
      (nx ? '<p class="mt-3 text-[13px] leading-relaxed"><span class="text-akured">Следующий шаг:</span> <span class="text-white/80">' + esc(nx) + '</span></p>'
          : '<p class="mt-3 text-[13px] text-akugreen">Направление закрыто полностью</p>') +
      (dir.note ? '<p class="mt-2 text-[12px] text-muted leading-relaxed">' + esc(dir.note) + '</p>' : '') +
      '</summary><div class="px-5 pb-5 border-t border-white/10">' + stages + '</div></details>';
  }).join('');

  const tw = DATA.reduce((a,d) => a + d.weight, 0);
  const got = DATA.reduce((a,d) => a + d.weight * dirPct(d), 0);
  const pct = Math.round(got / tw * 100);
  document.getElementById('totalPct').textContent = pct + '%';
  document.getElementById('totalBar').style.width = pct + '%';
  let all = 0, done = 0;
  DATA.forEach(d => d.stages.forEach((s, si) => {
    all += s.tasks.length;
    s.tasks.forEach((_, ti) => { if (isDone(d.id, si, ti)) done++; });
  }));
  document.getElementById('totalStats').textContent =
    done + ' из ' + all + ' задач · ' + DATA.length + ' направления' + (memoryOnly ? ' · прогресс не сохраняется в этом окне' : '');
}

/* ============ ДЕНЬГИ ============ */
let wFilter = 'all';
const PRIO = { high:{ label:'Высокий', cls:'text-gold border-gold/40 bg-gold/10', rank:0 },
               mid: { label:'Средний', cls:'text-akugreen border-akugreen/35 bg-akugreen/10', rank:1 },
               low: { label:'Низкий',  cls:'text-muted border-white/10', rank:2 } };

function renderMoney() {
  // цели
  document.getElementById('goalList').innerHTML = money.goals.length ? money.goals.map(g => {
    const p = g.target > 0 ? Math.min(100, Math.round(g.current / g.target * 100)) : 0;
    return '<div class="glass rounded-2xl p-5">' +
      '<div class="flex items-start justify-between gap-4 mb-3"><div class="min-w-0">' +
      '<h3 class="font-display text-[16px] font-semibold mb-0.5">' + esc(g.name) + '</h3>' +
      (g.note ? '<p class="text-[12px] text-muted">' + esc(g.note) + '</p>' : '') + '</div>' +
      '<div class="text-right shrink-0"><div class="font-display text-[19px] font-bold tabular-nums ' + (p >= 100 ? 'text-akugreen' : 'text-gold') + '">' + p + '%</div></div></div>' +
      '<div class="bar money ' + (p >= 100 ? 'done' : '') + ' mb-3"><i style="width:' + p + '%"></i></div>' +
      '<div class="flex items-center justify-between gap-3 flex-wrap">' +
      '<p class="text-[13px] tabular-nums"><span class="text-gold font-semibold">' + money$(g.current) + '</span>' +
      '<span class="text-muted"> из ' + money$(g.target) + ' · осталось ' + money$(Math.max(0, g.target - g.current)) + '</span></p>' +
      '<div class="flex gap-2"><button class="btn-g" data-gadd="' + g.id + '">Внести</button>' +
      '<button class="btn-g" data-gedit="' + g.id + '">Правка</button>' +
      '<button class="btn-g" data-gdel="' + g.id + '">Удалить</button></div></div></div>';
  }).join('') : '<p class="text-[13px] text-muted">Целей пока нет — добавь первую.</p>';

  // хотелки
  let list = money.wishes.slice();
  if (wFilter === 'bought') list = list.filter(w => w.bought);
  else if (wFilter !== 'all') list = list.filter(w => !w.bought && w.prio === wFilter);
  else list = list.filter(w => !w.bought).concat(list.filter(w => w.bought));

  const sort = document.getElementById('wSort').value;
  if (sort === 'cheap') list.sort((a,b) => (a.bought - b.bought) || (a.price - b.price));
  else if (sort === 'rich') list.sort((a,b) => (a.bought - b.bought) || (b.price - a.price));
  else list.sort((a,b) => (a.bought - b.bought) || (PRIO[a.prio].rank - PRIO[b.prio].rank) || (b.price - a.price));

  document.getElementById('wishList').innerHTML = list.length ? list.map(w => {
    const P = PRIO[w.prio] || PRIO.mid;
    return '<div class="glass rounded-2xl p-5 ' + (w.bought ? 'bought' : '') + '">' +
      '<div class="flex items-start justify-between gap-3 mb-2">' +
      '<h3 class="nm font-display text-[15px] font-semibold leading-snug">' + esc(w.name) + '</h3>' +
      '<span class="text-[11px] border rounded px-2 py-0.5 shrink-0 ' + P.cls + '">' + P.label + '</span></div>' +
      '<p class="font-display text-[24px] font-bold text-gold tabular-nums mb-3">' + money$(w.price) + '</p>' +
      '<div class="flex flex-wrap gap-2">' +
      (w.url ? '<a class="btn-g inline-block" href="' + esc(w.url) + '" target="_blank" rel="noopener noreferrer">Открыть</a>' : '') +
      '<button class="btn-g" data-wbuy="' + w.id + '">' + (w.bought ? 'Вернуть в список' : 'Куплено') + '</button>' +
      '<button class="btn-g" data-wdel="' + w.id + '">Удалить</button></div></div>';
  }).join('') : '<p class="text-[13px] text-muted">Пока пусто.</p>';

  const openSum = money.wishes.filter(w => !w.bought).reduce((a,w) => a + Number(w.price || 0), 0);
  const boughtSum = money.wishes.filter(w => w.bought).reduce((a,w) => a + Number(w.price || 0), 0);
  document.getElementById('wishSub').textContent =
    'Не куплено на ' + money$(openSum) + (boughtSum ? ' · куплено на ' + money$(boughtSum) : '');

  const saved = money.goals.reduce((a,g) => a + Number(g.current || 0), 0);
  const left = money.goals.reduce((a,g) => a + Math.max(0, Number(g.target || 0) - Number(g.current || 0)), 0);
  document.getElementById('mSaved').textContent = money$(saved);
  document.getElementById('mLeft').textContent = money$(left);
  document.getElementById('mWish').textContent = money$(openSum);
}

function render() { renderPlan(); renderMoney(); }

/* ============ СОБЫТИЯ ============ */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  const v = b.dataset.view;
  document.getElementById('view-plan').classList.toggle('hidden', v !== 'plan');
  document.getElementById('view-money').classList.toggle('hidden', v !== 'money');
}));

document.addEventListener('click', e => {
  const t = e.target.closest('.tick');
  if (t) {
    const k = key(t.dataset.d, t.dataset.s, t.dataset.t);
    const y = window.scrollY;
    if (state[k]) delete state[k]; else state[k] = true;
    save();
    const open = [...document.querySelectorAll('#app details')].map(d => d.open);
    renderPlan();
    [...document.querySelectorAll('#app details')].forEach((d, i) => d.open = open[i]);
    window.scrollTo(0, y);
    return;
  }

  const gAdd = e.target.closest('[data-gadd]');
  if (gAdd) {
    const g = money.goals.find(x => x.id === gAdd.dataset.gadd);
    const v = prompt('Сколько добавить к «' + g.name + '»? Можно с минусом, чтобы убавить.', '');
    if (v === null) return;
    const n = parseFloat(String(v).replace(',', '.'));
    if (isNaN(n)) return;
    g.current = Math.max(0, Number(g.current || 0) + n);
    save(); renderMoney(); return;
  }
  const gEd = e.target.closest('[data-gedit]');
  if (gEd) {
    const g = money.goals.find(x => x.id === gEd.dataset.gedit);
    const name = prompt('Название цели', g.name); if (name === null) return;
    const tgt = prompt('Сумма цели, $', g.target); if (tgt === null) return;
    const cur = prompt('Уже есть, $', g.current); if (cur === null) return;
    const note = prompt('Срок или пояснение', g.note || ''); if (note === null) return;
    g.name = name.trim() || g.name;
    g.target = Math.max(0, parseFloat(String(tgt).replace(',', '.')) || 0);
    g.current = Math.max(0, parseFloat(String(cur).replace(',', '.')) || 0);
    g.note = note.trim();
    save(); renderMoney(); return;
  }
  const gDel = e.target.closest('[data-gdel]');
  if (gDel) {
    const g = money.goals.find(x => x.id === gDel.dataset.gdel);
    if (confirm('Удалить цель «' + g.name + '»?')) { money.goals = money.goals.filter(x => x.id !== g.id); save(); renderMoney(); }
    return;
  }
  const wBuy = e.target.closest('[data-wbuy]');
  if (wBuy) {
    const w = money.wishes.find(x => x.id === wBuy.dataset.wbuy);
    w.bought = !w.bought; save(); renderMoney(); return;
  }
  const wDel = e.target.closest('[data-wdel]');
  if (wDel) {
    const w = money.wishes.find(x => x.id === wDel.dataset.wdel);
    if (confirm('Удалить «' + w.name + '» из списка?')) { money.wishes = money.wishes.filter(x => x.id !== w.id); save(); renderMoney(); }
    return;
  }
  const chip = e.target.closest('.chip');
  if (chip) {
    wFilter = chip.dataset.f;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
    renderMoney(); return;
  }
});

document.getElementById('wSort').addEventListener('change', renderMoney);

const gForm = document.getElementById('goalForm'), wForm = document.getElementById('wishForm');
document.getElementById('addGoalBtn').addEventListener('click', () => gForm.classList.toggle('hidden'));
document.getElementById('gCancel').addEventListener('click', () => gForm.classList.add('hidden'));
document.getElementById('gSave').addEventListener('click', () => {
  const name = document.getElementById('gName').value.trim();
  const target = parseFloat(document.getElementById('gTarget').value) || 0;
  if (!name || target <= 0) { alert('Нужны название и сумма цели больше нуля'); return; }
  money.goals.push({ id: uid(), name, target,
    current: Math.max(0, parseFloat(document.getElementById('gCurrent').value) || 0),
    note: document.getElementById('gNote').value.trim() });
  ['gName','gTarget','gCurrent','gNote'].forEach(i => document.getElementById(i).value = '');
  gForm.classList.add('hidden'); save(); renderMoney();
});

document.getElementById('addWishBtn').addEventListener('click', () => wForm.classList.toggle('hidden'));
document.getElementById('wCancel').addEventListener('click', () => wForm.classList.add('hidden'));
document.getElementById('wSave').addEventListener('click', () => {
  const name = document.getElementById('wName').value.trim();
  const price = parseFloat(document.getElementById('wPrice').value) || 0;
  if (!name) { alert('Напиши, что хочешь купить'); return; }
  money.wishes.push({ id: uid(), name, price, prio: document.getElementById('wPrio').value,
    url: document.getElementById('wUrl').value.trim(), bought: false });
  ['wName','wPrice','wUrl'].forEach(i => document.getElementById(i).value = '');
  wForm.classList.add('hidden'); save(); renderMoney();
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Снять все галочки по задачам и вернуть деньги к исходному списку?')) return;
  state = {}; money = structuredClone(DEFAULT_MONEY); save(); render();
});

(function () {
  const n = Math.max(0, Math.ceil((new Date('2026-12-31T23:59:59') - new Date()) / 86400000));
  document.getElementById('daysLeft').textContent = n + ' дней до конца года';
})();

load();
render();
</script>
</body>
</html>
